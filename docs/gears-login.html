<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login — GEARS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --bg: #f5f7f5;
        --surface: #ffffff;
        --surface-2: #f0f4f0;
        --border: rgba(0, 0, 0, 0.08);
        --border-md: rgba(0, 0, 0, 0.13);
        --teal: #3d8b6e;
        --teal-dim: rgba(61, 139, 110, 0.09);
        --teal-mid: rgba(61, 139, 110, 0.22);
        --text-1: #1a2420;
        --text-2: #5a6e68;
        --text-3: #9eb0aa;
        --radius: 10px;
        --radius-sm: 6px;
      }

      body {
        font-family: "Geist", system-ui, sans-serif;
        background: var(--bg);
        color: var(--text-1);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      /* ─── Layout ─── */
      .wrap {
        flex: 1;
        display: grid;
        grid-template-columns: 1fr 480px;
      }

      /* ─── Left panel ─── */
      .panel-left {
        background: linear-gradient(
          160deg,
          #0d2318 0%,
          #1a3a2a 50%,
          #0e2820 100%
        );
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 48px 56px;
        position: relative;
        overflow: hidden;
      }

      .panel-left > * {
        position: relative;
        z-index: 1;
      }

      .iso-art {
        position: absolute;
        width: 100%;
        left: 0;
        top: 48px;
        height: 64%;
        opacity: 0.92;
      }

      .panel-brand {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .brand-mark {
        width: 36px;
        height: 36px;
        background: rgba(255, 255, 255, 0.2);
        border-radius: 9px;
        display: flex;
        align-items: center;
        justify-content: center;
        backdrop-filter: blur(4px);
      }

      .brand-name {
        font-size: 18px;
        font-weight: 700;
        color: #fff;
        letter-spacing: -0.3px;
      }

      .panel-copy {
      }

      .panel-copy h2 {
        font-size: 32px;
        font-weight: 700;
        color: #fff;
        line-height: 1.25;
        letter-spacing: -0.6px;
        text-shadow: 0 2px 12px rgba(0, 0, 0, 0.5);
        margin-bottom: 14px;
      }

      .panel-copy p {
        font-size: 14px;
        color: rgba(255, 255, 255, 0.85);
        line-height: 1.7;
        max-width: 360px;
        text-shadow: 0 1px 8px rgba(0, 0, 0, 0.5);
      }

      .panel-tags {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .panel-tag {
        padding: 5px 12px;
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.15);
        font-size: 11.5px;
        font-weight: 500;
        color: rgba(255, 255, 255, 0.9);
        border: 1px solid rgba(255, 255, 255, 0.2);
      }

      /* ─── Right panel ─── */
      .panel-right {
        background: var(--surface);
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 56px 48px;
        position: relative;
      }

      .login-header {
        margin-bottom: 32px;
      }

      .login-header h1 {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.4px;
        color: var(--text-1);
        margin-bottom: 6px;
      }

      .login-header p {
        font-size: 13px;
        color: var(--text-2);
      }

      /* ─── Form ─── */
      .form {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .field label {
        font-size: 12px;
        font-weight: 600;
        color: var(--text-2);
        letter-spacing: 0.2px;
      }

      .input-wrap {
        position: relative;
      }

      .input-icon {
        position: absolute;
        left: 12px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-3);
        pointer-events: none;
        display: flex;
      }

      .field input {
        width: 100%;
        height: 42px;
        padding: 0 12px 0 38px;
        border: 1px solid var(--border-md);
        border-radius: var(--radius-sm);
        font-family: "Geist", system-ui, sans-serif;
        font-size: 13px;
        color: var(--text-1);
        background: var(--surface);
        outline: none;
        transition:
          border-color 0.15s,
          box-shadow 0.15s;
      }

      .field input::placeholder {
        color: var(--text-3);
      }

      .field input:focus {
        border-color: var(--teal);
        box-shadow: 0 0 0 3px var(--teal-dim);
      }

      .field-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .remember {
        display: flex;
        align-items: center;
        gap: 7px;
        cursor: pointer;
        font-size: 12.5px;
        color: var(--text-2);
        user-select: none;
      }

      .remember input[type="checkbox"] {
        width: 15px;
        height: 15px;
        accent-color: var(--teal);
        cursor: pointer;
      }

      .forgot {
        font-size: 12.5px;
        color: var(--teal);
        text-decoration: none;
        font-weight: 500;
      }
      .forgot:hover {
        text-decoration: underline;
      }

      .btn-login {
        width: 100%;
        height: 44px;
        background: var(--teal);
        color: #fff;
        border: none;
        border-radius: var(--radius-sm);
        font-family: "Geist", system-ui, sans-serif;
        font-size: 13.5px;
        font-weight: 600;
        cursor: pointer;
        transition:
          background 0.15s,
          transform 0.1s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        margin-top: 4px;
      }

      .btn-login:hover {
        background: #34775e;
      }
      .btn-login:active {
        transform: scale(0.99);
      }

      .divider {
        display: flex;
        align-items: center;
        gap: 12px;
        color: var(--text-3);
        font-size: 11.5px;
      }
      .divider::before,
      .divider::after {
        content: "";
        flex: 1;
        height: 1px;
        background: var(--border);
      }

      .sso-btn {
        width: 100%;
        height: 42px;
        border: 1px solid var(--border-md);
        border-radius: var(--radius-sm);
        background: var(--surface);
        color: var(--text-1);
        font-family: "Geist", system-ui, sans-serif;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        transition: all 0.15s;
      }
      .sso-btn:hover {
        background: var(--surface-2);
        border-color: var(--teal-mid);
      }

      .login-footer {
        margin-top: 32px;
        text-align: center;
        font-size: 12px;
        color: var(--text-3);
        line-height: 1.7;
      }

      /* ─── Error state ─── */
      .error-msg {
        display: none;
        align-items: center;
        gap: 7px;
        padding: 10px 14px;
        background: rgba(192, 57, 43, 0.08);
        border: 1px solid rgba(192, 57, 43, 0.2);
        border-radius: var(--radius-sm);
        font-size: 12.5px;
        color: #c0392b;
      }
      .error-msg.show {
        display: flex;
      }

      @media (max-width: 720px) {
        .wrap {
          grid-template-columns: 1fr;
        }
        .panel-left {
          display: none;
        }
        .panel-right {
          padding: 48px 28px;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <!-- Left panel -->
      <div class="panel-left">
        <div class="panel-brand">
          <img
            src="logo.png"
            alt="GEARS"
            style="
              height: 30px;
              display: block;
              filter: brightness(0) invert(1);
            "
          />
        </div>

        <!-- Container ship line illustration -->
        <svg
          class="iso-art"
          viewBox="0 0 480 320"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
          aria-hidden="true"
        >
          <!-- Stars -->
          <circle cx="35"  cy="25"  r="1"   fill="rgba(255,255,255,.22)"/>
          <circle cx="98"  cy="12"  r="1.3" fill="rgba(255,255,255,.2)"/>
          <circle cx="190" cy="8"   r="1"   fill="rgba(255,255,255,.16)"/>
          <circle cx="308" cy="28"  r="1.3" fill="rgba(255,255,255,.2)"/>
          <circle cx="408" cy="14"  r="1"   fill="rgba(255,255,255,.18)"/>
          <circle cx="458" cy="48"  r="1.3" fill="rgba(255,255,255,.16)"/>
          <circle cx="50"  cy="95"  r="1"   fill="rgba(255,255,255,.12)"/>
          <circle cx="452" cy="102" r="1"   fill="rgba(255,255,255,.12)"/>
          <circle cx="158" cy="58"  r="1"   fill="rgba(255,255,255,.1)"/>
          <circle cx="380" cy="42"  r="1"   fill="rgba(255,255,255,.13)"/>
          <circle cx="238" cy="20"  r="1.2" fill="rgba(255,255,255,.18)"/>
          <circle cx="142" cy="35"  r="1"   fill="rgba(255,255,255,.12)"/>
          <circle cx="318" cy="60"  r="1"   fill="rgba(255,255,255,.1)"/>

          <!-- Horizon glow -->
          <ellipse cx="240" cy="168" rx="260" ry="22" fill="rgba(79,168,130,.07)"/>

          <!-- ── WAVE LAYERS — far to near, opacity + amplitude increase ── -->

          <!-- Far (y≈130–168, tight + faint) -->
          <path d="M0,132 Q60,129 120,132 Q180,135 240,132 Q300,129 360,132 Q420,135 480,132" stroke="rgba(79,168,130,.07)" stroke-width=".5" fill="none" stroke-linecap="round"/>
          <path d="M0,144 Q80,141 160,145 Q240,149 320,144 Q400,140 480,143"                  stroke="rgba(79,168,130,.09)" stroke-width=".6" fill="none" stroke-linecap="round"/>
          <path d="M0,156 Q70,152 140,157 Q210,162 280,156 Q350,150 420,155 Q455,158 480,156" stroke="rgba(79,168,130,.12)" stroke-width=".7" fill="none" stroke-linecap="round"/>
          <path d="M0,167 Q60,163 120,168 Q180,173 240,167 Q300,161 360,167 Q420,172 480,168" stroke="rgba(79,168,130,.18)" stroke-width=".9" fill="none" stroke-linecap="round"/>

          <!-- Mid (y≈180–224, growing) -->
          <path d="M0,180 Q80,174 160,181 Q240,188 320,180 Q400,172 480,178"                  stroke="rgba(79,168,130,.25)" stroke-width="1.1" fill="none" stroke-linecap="round"/>
          <path d="M0,193 Q70,186 140,194 Q210,202 280,193 Q350,184 420,192 Q458,196 480,193" stroke="rgba(79,168,130,.31)" stroke-width="1.2" fill="none" stroke-linecap="round"/>
          <path d="M0,207 Q80,199 160,208 Q240,217 320,207 Q400,197 480,204"                  stroke="rgba(79,168,130,.37)" stroke-width="1.4" fill="none" stroke-linecap="round"/>
          <path d="M0,221 Q70,212 140,222 Q210,232 280,221 Q350,210 420,220 Q458,225 480,221" stroke="rgba(79,168,130,.42)" stroke-width="1.5" fill="none" stroke-linecap="round"/>

          <!-- Near (y≈236–300, widest + most opaque, then fading) -->
          <path d="M0,236 Q80,226 160,237 Q240,248 320,236 Q400,224 480,233"                  stroke="rgba(79,168,130,.44)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
          <path d="M0,252 Q70,241 140,253 Q210,265 280,252 Q350,239 420,250 Q458,256 480,252" stroke="rgba(79,168,130,.40)" stroke-width="1.4" fill="none" stroke-linecap="round"/>
          <path d="M0,268 Q80,257 160,269 Q240,281 320,268 Q400,255 480,265"                  stroke="rgba(79,168,130,.33)" stroke-width="1.2" fill="none" stroke-linecap="round"/>
          <path d="M0,283 Q70,272 140,284 Q210,296 280,283 Q350,270 420,281 Q458,287 480,283" stroke="rgba(79,168,130,.24)" stroke-width="1.0" fill="none" stroke-linecap="round"/>
          <path d="M0,298 Q80,287 160,299 Q240,311 320,298 Q400,285 480,295"                  stroke="rgba(79,168,130,.15)" stroke-width=".8"  fill="none" stroke-linecap="round"/>

          <!-- Wave crest shimmers (subtle bright accents) -->
          <path d="M88,200 Q108,196 128,200"  stroke="rgba(120,210,170,.32)" stroke-width="1.2" fill="none" stroke-linecap="round"/>
          <path d="M255,214 Q278,209 300,214" stroke="rgba(120,210,170,.28)" stroke-width="1.1" fill="none" stroke-linecap="round"/>
          <path d="M360,228 Q388,222 415,228" stroke="rgba(120,210,170,.24)" stroke-width="1.0" fill="none" stroke-linecap="round"/>
          <path d="M42,244 Q72,238 102,244"   stroke="rgba(120,210,170,.22)" stroke-width="1.0" fill="none" stroke-linecap="round"/>
          <path d="M185,258 Q215,251 245,258" stroke="rgba(120,210,170,.2)"  stroke-width=".9"  fill="none" stroke-linecap="round"/>

          <!-- Ambient -->
          <circle cx="20"  cy="305" r="1.2" fill="rgba(79,168,130,.18)"/>
          <circle cx="460" cy="308" r="1"   fill="rgba(79,168,130,.14)"/>
          <circle cx="240" cy="315" r="1"   fill="rgba(79,168,130,.12)"/>
        </svg>

        <div class="panel-copy">
          <h2>GHG Emission,<br />Authentic Reporting<br />System</h2>
          <p>
            IMO DCS · EU MRV · CII 규정에 대응하는 해운사 온실가스 배출량 검증
            플랫폼입니다.
          </p>
        </div>

        <div class="panel-tags">
          <span class="panel-tag">IMO DCS</span>
          <span class="panel-tag">EU MRV</span>
          <span class="panel-tag">CII Verification</span>
          <span class="panel-tag">FuelEU Maritime</span>
        </div>
      </div>

      <!-- Right panel -->
      <div class="panel-right">
        <div class="login-header">
          <h1>Sign in</h1>
          <p>KR GEARS 계정으로 로그인하세요</p>
        </div>

        <div class="form" id="loginForm">
          <div class="error-msg" id="errorMsg">
            <svg
              width="14"
              height="14"
              viewBox="0 0 16 16"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
            >
              <circle cx="8" cy="8" r="7" />
              <path d="M8 5v3M8 11h.01" />
            </svg>
            아이디 또는 비밀번호를 확인해 주세요.
          </div>

          <div class="field">
            <label for="userId">아이디 (ID)</label>
            <div class="input-wrap">
              <span class="input-icon">
                <svg
                  width="14"
                  height="14"
                  viewBox="0 0 16 16"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.6"
                >
                  <circle cx="8" cy="6" r="3" />
                  <path d="M2 14c0-3 2.7-5 6-5s6 2 6 5" />
                </svg>
              </span>
              <input
                type="text"
                id="userId"
                placeholder="아이디를 입력하세요"
                autocomplete="username"
              />
            </div>
          </div>

          <div class="field">
            <label for="userPw">비밀번호</label>
            <div class="input-wrap">
              <span class="input-icon">
                <svg
                  width="14"
                  height="14"
                  viewBox="0 0 16 16"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.6"
                >
                  <rect x="3" y="7" width="10" height="8" rx="1.5" />
                  <path d="M5 7V5a3 3 0 0 1 6 0v2" />
                </svg>
              </span>
              <input
                type="password"
                id="userPw"
                placeholder="비밀번호를 입력하세요"
                autocomplete="current-password"
              />
            </div>
          </div>

          <div class="field-row">
            <label class="remember">
              <input type="checkbox" id="rememberMe" /> 로그인 상태 유지
            </label>
            <a href="#" class="forgot">비밀번호 찾기</a>
          </div>

          <button class="btn-login" id="loginBtn" onclick="handleLogin()">
            <svg
              width="14"
              height="14"
              viewBox="0 0 16 16"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                d="M6 3H3a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h3M10 11l3-3-3-3M13 8H6"
              />
            </svg>
            로그인
          </button>

          <div class="divider">또는</div>

          <button class="sso-btn">
            <svg
              width="15"
              height="15"
              viewBox="0 0 16 16"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
            >
              <rect x="2" y="2" width="5" height="5" rx="1" />
              <rect x="9" y="2" width="5" height="5" rx="1" />
              <rect x="2" y="9" width="5" height="5" rx="1" />
              <rect x="9" y="9" width="5" height="5" rx="1" />
            </svg>
            KR SSO 로그인
          </button>
        </div>

        <div class="login-footer">
          계정이 없으신가요? 관리자에게 문의하세요.<br />
          © 2025 Korean Register. All rights reserved.
        </div>
      </div>
    </div>

    <script>
      // Login
      function handleLogin() {
        const id = document.getElementById("userId").value.trim();
        const pw = document.getElementById("userPw").value;
        const err = document.getElementById("errorMsg");
        if (!id || !pw) {
          err.classList.add("show");
          return;
        }
        err.classList.remove("show");
        window.location.href = "gears-dashboard-redesign.html";
      }

      document.getElementById("userPw").addEventListener("keydown", (e) => {
        if (e.key === "Enter") handleLogin();
      });
    </script>
  </body>
</html>
