<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — GEARS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #f5f7f5;
      --surface:   #ffffff;
      --surface-2: #f0f4f0;
      --border:    rgba(0,0,0,.08);
      --border-md: rgba(0,0,0,.13);
      --teal:      #3d8b6e;
      --teal-dim:  rgba(61,139,110,.09);
      --teal-mid:  rgba(61,139,110,.22);
      --text-1:    #1a2420;
      --text-2:    #5a6e68;
      --text-3:    #9eb0aa;
      --radius:    10px;
      --radius-sm: 6px;
    }

body {
      font-family: 'Geist', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text-1);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ─── Layout ─── */
    .wrap {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 480px;
    }

    /* ─── Left panel ─── */
    .panel-left {
      background: #1a2e26;
      background-image: url('https://images.unsplash.com/photo-1494412574643-ff11b0a5c1c3?fit=crop&w=960&q=80');
      background-size: cover;
      background-position: center;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 48px 56px;
      position: relative;
      overflow: hidden;
    }

    .panel-left::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        linear-gradient(to top, rgba(0,0,0,.7) 0%, transparent 45%),
        linear-gradient(to bottom, rgba(0,0,0,.35) 0%, transparent 35%);
    }

    .panel-left > * { position: relative; z-index: 1; }

    .panel-brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-mark {
      width: 36px; height: 36px;
      background: rgba(255,255,255,.2);
      border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      backdrop-filter: blur(4px);
    }

    .brand-name {
      font-size: 18px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -.3px;
    }

    .panel-copy { }

    .panel-copy h2 {
      font-size: 32px;
      font-weight: 700;
      color: #fff;
      line-height: 1.25;
      letter-spacing: -.6px;
      text-shadow: 0 2px 12px rgba(0,0,0,.5);
      margin-bottom: 14px;
    }

    .panel-copy p {
      font-size: 14px;
      color: rgba(255,255,255,.85);
      line-height: 1.7;
      max-width: 360px;
      text-shadow: 0 1px 8px rgba(0,0,0,.5);
    }

    .panel-tags {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .panel-tag {
      padding: 5px 12px;
      border-radius: 20px;
      background: rgba(255,255,255,.15);
      font-size: 11.5px;
      font-weight: 500;
      color: rgba(255,255,255,.9);
      border: 1px solid rgba(255,255,255,.2);
    }

    /* ─── Right panel ─── */
    .panel-right {
      background: var(--surface);
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 56px 48px;
      position: relative;
    }

.login-header { margin-bottom: 32px; }

    .login-header h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -.4px;
      color: var(--text-1);
      margin-bottom: 6px;
    }

    .login-header p {
      font-size: 13px;
      color: var(--text-2);
    }

    /* ─── Form ─── */
    .form { display: flex; flex-direction: column; gap: 16px; }

    .field { display: flex; flex-direction: column; gap: 6px; }

    .field label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-2);
      letter-spacing: .2px;
    }

    .input-wrap { position: relative; }

    .input-icon {
      position: absolute;
      left: 12px; top: 50%; transform: translateY(-50%);
      color: var(--text-3);
      pointer-events: none;
      display: flex;
    }

    .field input {
      width: 100%;
      height: 42px;
      padding: 0 12px 0 38px;
      border: 1px solid var(--border-md);
      border-radius: var(--radius-sm);
      font-family: 'Geist', system-ui, sans-serif;
      font-size: 13px;
      color: var(--text-1);
      background: var(--surface);
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }

    .field input::placeholder { color: var(--text-3); }

    .field input:focus {
      border-color: var(--teal);
      box-shadow: 0 0 0 3px var(--teal-dim);
    }

    .field-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .remember {
      display: flex;
      align-items: center;
      gap: 7px;
      cursor: pointer;
      font-size: 12.5px;
      color: var(--text-2);
      user-select: none;
    }

    .remember input[type="checkbox"] {
      width: 15px; height: 15px;
      accent-color: var(--teal);
      cursor: pointer;
    }

    .forgot {
      font-size: 12.5px;
      color: var(--teal);
      text-decoration: none;
      font-weight: 500;
    }
    .forgot:hover { text-decoration: underline; }

    .btn-login {
      width: 100%;
      height: 44px;
      background: var(--teal);
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      font-family: 'Geist', system-ui, sans-serif;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s, transform .1s;
      display: flex; align-items: center; justify-content: center; gap: 6px;
      margin-top: 4px;
    }

    .btn-login:hover { background: #34775e; }
    .btn-login:active { transform: scale(.99); }

    .divider {
      display: flex; align-items: center; gap: 12px;
      color: var(--text-3); font-size: 11.5px;
    }
    .divider::before, .divider::after {
      content: ''; flex: 1; height: 1px; background: var(--border);
    }

    .sso-btn {
      width: 100%; height: 42px;
      border: 1px solid var(--border-md);
      border-radius: var(--radius-sm);
      background: var(--surface);
      color: var(--text-1);
      font-family: 'Geist', system-ui, sans-serif;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: all .15s;
    }
    .sso-btn:hover { background: var(--surface-2); border-color: var(--teal-mid); }

    .login-footer {
      margin-top: 32px;
      text-align: center;
      font-size: 12px;
      color: var(--text-3);
      line-height: 1.7;
    }

    /* ─── Error state ─── */
    .error-msg {
      display: none;
      align-items: center;
      gap: 7px;
      padding: 10px 14px;
      background: rgba(192,57,43,.08);
      border: 1px solid rgba(192,57,43,.2);
      border-radius: var(--radius-sm);
      font-size: 12.5px;
      color: #c0392b;
    }
    .error-msg.show { display: flex; }

    @media (max-width: 720px) {
      .wrap { grid-template-columns: 1fr; }
      .panel-left { display: none; }
      .panel-right { padding: 48px 28px; }
    }
  </style>
</head>
<body>

<div class="wrap">
  <!-- Left panel -->
  <div class="panel-left">
    <div class="panel-brand">
      <img src="logo.png" alt="GEARS" style="height:30px; display:block; filter:brightness(0) invert(1);">
    </div>

    <div class="panel-copy">
      <h2>GHG Emission,<br>Authentic Reporting<br>System</h2>
      <p>IMO DCS · EU MRV · CII 규정에 대응하는 해운사 온실가스 배출량 검증 플랫폼입니다.</p>
    </div>

    <div class="panel-tags">
      <span class="panel-tag">IMO DCS</span>
      <span class="panel-tag">EU MRV</span>
      <span class="panel-tag">CII Verification</span>
      <span class="panel-tag">FuelEU Maritime</span>
    </div>
  </div>

  <!-- Right panel -->
  <div class="panel-right">

<div class="login-header">
      <h1>Sign in</h1>
      <p>KR GEARS 계정으로 로그인하세요</p>
    </div>

    <div class="form" id="loginForm">
      <div class="error-msg" id="errorMsg">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="8" cy="8" r="7"/><path d="M8 5v3M8 11h.01"/></svg>
        아이디 또는 비밀번호를 확인해 주세요.
      </div>

      <div class="field">
        <label for="userId">아이디 (ID)</label>
        <div class="input-wrap">
          <span class="input-icon">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8" cy="6" r="3"/><path d="M2 14c0-3 2.7-5 6-5s6 2 6 5"/></svg>
          </span>
          <input type="text" id="userId" placeholder="아이디를 입력하세요" autocomplete="username">
        </div>
      </div>

      <div class="field">
        <label for="userPw">비밀번호</label>
        <div class="input-wrap">
          <span class="input-icon">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="7" width="10" height="8" rx="1.5"/><path d="M5 7V5a3 3 0 0 1 6 0v2"/></svg>
          </span>
          <input type="password" id="userPw" placeholder="비밀번호를 입력하세요" autocomplete="current-password">
        </div>
      </div>

      <div class="field-row">
        <label class="remember">
          <input type="checkbox" id="rememberMe"> 로그인 상태 유지
        </label>
        <a href="#" class="forgot">비밀번호 찾기</a>
      </div>

      <button class="btn-login" id="loginBtn" onclick="handleLogin()">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3H3a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h3M10 11l3-3-3-3M13 8H6"/></svg>
        로그인
      </button>

      <div class="divider">또는</div>

      <button class="sso-btn">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="2" width="5" height="5" rx="1"/><rect x="9" y="2" width="5" height="5" rx="1"/><rect x="2" y="9" width="5" height="5" rx="1"/><rect x="9" y="9" width="5" height="5" rx="1"/></svg>
        KR SSO 로그인
      </button>
    </div>

    <div class="login-footer">
      계정이 없으신가요? 관리자에게 문의하세요.<br>
      © 2025 Korean Register. All rights reserved.
    </div>
  </div>
</div>

<script>
  // Login
  function handleLogin() {
    const id = document.getElementById('userId').value.trim();
    const pw = document.getElementById('userPw').value;
    const err = document.getElementById('errorMsg');
    if (!id || !pw) {
      err.classList.add('show');
      return;
    }
    err.classList.remove('show');
    window.location.href = 'gears-dashboard-redesign.html';
  }

  document.getElementById('userPw').addEventListener('keydown', e => {
    if (e.key === 'Enter') handleLogin();
  });
</script>
</body>
</html>
